<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日森精工 | 👥 員工名冊模組</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- 🌐 共享數據中心 -->
    <script src="../../../../../../global_shared.js"></script>

    <style>
        :root {
            --primary: #0F172A;
            --primary-light: #1E293B;
            --accent: #38BDF8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --bg-dark: #090D1A;
            --card-bg: rgba(30, 41, 59, 0.4);
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
        }

        body {
            background: url('../../../../../../01_企業識別與設計/底色.png') center center / cover no-repeat fixed;
            color: var(--text-light);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* ════════════════════ 工具列 ════════════════════ */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* ════════════════════ 表格樣式 ════════════════════ */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            background: rgba(15, 23, 42, 0.3);
        }

        tr:hover td {
            background: rgba(56, 189, 248, 0.03);
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-lead {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .tag-staff {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .tag-hire {
            background: rgba(16, 185, 129, 0.15);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .tag-contract {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }


        /* 操作按鈕 */
        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.3rem;
            font-size: 1rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ════════════════════ 彈窗 Modal ════════════════════ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.8);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1E293B;
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 650px;
            max-width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5rem;
        }

        .modal-close:hover {
            color: white;
        }

        .modal-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* 表單樣式 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* 按鈕樣式 */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-light);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.25);
        }

        /* 狀態標籤 */
        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-active {
            background: rgba(16, 185, 129, 0.15);
            color: #34D399;
        }
        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; width: 100%;">
            <div>
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 8px; flex-wrap: wrap;">
                    <img src="../../../../../../01_企業識別與設計/橫式logo.png" alt="Logo" style="height: 57px; width: auto; filter: drop-shadow(0 0 4px rgba(255,255,255,0.05));">
                    <h1 style="font-size: 1.45rem; border-left: 2px solid var(--border); padding-left: 16px; font-weight: 700; color: #FFFFFF; margin: 0; display: flex; align-items: center; gap: 8px;">👥 員工名冊模組 <span style="font-size: 0.68rem; font-weight: normal; color: var(--text-muted, #64748B); margin-left: 8px; vertical-align: middle; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); letter-spacing: 0.5px;">v1.0.0</span></h1>
                </div>
                <p class="subtitle" style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">最基礎的同仁名冊與通訊錄登記</p>
            </div>
            
        </div>
    </header>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜尋姓名、電話或專業..." oninput="renderEmployeeTable()">
            </div>
        </div>

        <div class="glass-card">
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>職務身分</th>
                        <th>法規身分</th>
                        <th>專長類別</th>
                        <th>聯絡電話</th>
                        <th>身分證字號</th>
                        <th>撥款銀行</th>
                        <th>薪資帳號</th>
                        <th>津貼明細</th>
                        <th style="width: 100px; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="employee-table-body">
                    <!-- 動態渲染 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 👥 新增/編輯 員工彈窗 -->
    <div class="modal-overlay" id="employee-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modal-title">👥 新增同仁人事檔案</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-original-name">

                <div class="form-row">
                    <div class="form-group">
                        <label>員工姓名 <span style="color:var(--danger)">*</span></label>
                        <input type="text" id="emp-name" placeholder="請輸入姓名">
                    </div>
                    <div class="form-group">
                        <label>專長類別</label>
                        <select id="emp-specialty">
                            <option value="拉線工程">拉線工程</option>
                            <option value="接線工程">接線工程</option>
                            <option value="軌道安裝">軌道安裝</option>
                            <option value="工安監督">工安監督</option>
                            <option value="行政後勤">行政後勤</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>聯絡電話</label>
                        <input type="text" id="emp-phone" placeholder="例如: 0912-345-678">
                    </div>
                    <div class="form-group">
                        <label>身分身分 (領隊/班長)</label>
                        <select id="emp-is-lead">
                            <option value="false">一般同仁 / 現場工程師</option>
                            <option value="true">現場領隊 / 班長 (出勤加發領導加給)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>勞動法規身分 <span style="color:var(--danger)">*</span></label>
                        <select id="emp-labor-type">
                            <option value="hire">雇傭 - 有勞健保</option>
                            <option value="contract">承攬 - 無勞健保</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>身分證號 (EHS 入廠報備用)</label>
                        <input type="text" id="emp-idno" placeholder="例如: A123456789">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>發薪狀態</label>
                        <select id="emp-status">
                            <option value="已核准">正式生效 ✅</option>
                            <option value="待審核">審核中 ⏳</option>
                            <option value="增員中">意向登記 📋</option>
                        </select>
                    </div>
                    <div class="form-group"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>發薪撥款銀行代碼</label>
                        <input type="text" id="emp-bank-no" placeholder="例如: 013 (國泰), 700 (郵局)">
                    </div>
                    <div class="form-group">
                        <label>撥款帳號</label>
                        <input type="text" id="emp-bank-acct" placeholder="輸入撥薪銀行帳號">
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 0.5rem;">
                    <span style="font-size: 0.85rem; font-weight: 600; color: var(--accent); display: block; margin-bottom: 0.75rem;">💰 日常津貼與領導加給配置</span>
                    <div class="form-row-3">
                        <div class="form-group">
                            <label>交通津貼 (日/月)</label>
                            <input type="number" id="emp-allow-trans" value="0">
                        </div>
                        <div class="form-group">
                            <label>住宿補貼 (日/月)</label>
                            <input type="number" id="emp-allow-lodg" value="0">
                        </div>
                        <div class="form-group">
                            <label>專業加給 (日/月)</label>
                            <input type="number" id="emp-allow-prof" value="0">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEmployeeData()">💾 儲存人事資料</button>
            </div>
        </div>
    </div>

    <script>
        // 頁面初始化
        window.addEventListener("DOMContentLoaded", function() {
            renderEmployeeTable();
        });

        // 渲染員工列表
        function renderEmployeeTable() {
            HimoriDb.load();
            
            const tbody = document.getElementById("employee-table-body");
            tbody.innerHTML = "";
            
            const searchVal = document.getElementById("search-input").value.toLowerCase().trim();
            
            let employees = HimoriDb.employeeDb || {};
            
            // 防禦防呆：若無任何員工資料，自動補齊預設三位同仁
            if (Object.keys(employees).length === 0) {
                console.log("偵測到員工名冊為空，自動初始化預設三位同仁...");
                HimoriDb.employeeDb = {
                    "張憲明": { specialty: "拉線工程", transAllow: 1000, lodgAllow: 0, profAllow: 500, isLead: false, laborType: "contract" },
                    "李志強": { specialty: "接線工程", transAllow: 1000, lodgAllow: 2000, profAllow: 1000, isLead: true, laborType: "hire" },
                    "王大同": { specialty: "軌道安裝", transAllow: 0, lodgAllow: 0, profAllow: 0, isLead: false, laborType: "contract" }
                };
                
                if (HimoriDb.intentDb && HimoriDb.intentDb.length === 0) {
                    HimoriDb.intentDb = [
                        { name: "張憲明", phone: "0912-345-678", step: "completed", idno: "A123456789", bankNo: "013", bankAcct: "123456789012", signDate: "2026-06-12", status: "已核准" },
                        { name: "李志強", phone: "0923-456-789", step: "completed", idno: "B123456789", bankNo: "700", bankAcct: "123456789012", signDate: "2026-06-12", status: "已核准" },
                        { name: "王大同", phone: "0934-567-890", step: "signed", idno: "C123456789", bankNo: "007", bankAcct: "123456789012", signDate: "2026-06-15", status: "待審核" }
                    ];
                }
                
                if (HimoriDb.cardsDb && Object.keys(HimoriDb.cardsDb).length === 0) {
                    HimoriDb.cardsDb = {
                        "張憲明": { enabled: true, title: "拉線組長", phone: "0912-345-678", address: "台北市大安區信義路四段1號2樓" },
                        "李志強": { enabled: true, title: "工程主任 / 領隊", phone: "0923-456-789", address: "台北市大安區信義路四段1號2樓" },
                        "王大同": { enabled: false, title: "技術專員", phone: "0934-567-890", address: "台北市大安區信義路四段1號2樓" }
                    };
                }
                
                HimoriDb.save();
                window.parent.dispatchEvent(new CustomEvent('himori_db_updated'));
                employees = HimoriDb.employeeDb;
            }
            

            Object.keys(employees).forEach(name => {
                const emp = employees[name];
                
                // 從意向資料庫獲取銀行及身分證號資料
                const intentList = HimoriDb.intentDb || [];
                const intentInfo = intentList.find(i => i.name === name) || {};
                
                // 從電子名片獲取電話資料
                const cards = HimoriDb.cardsDb || {};
                const cardInfo = cards[name] || {};

                // 搜尋過濾
                const phone = cardInfo.phone || intentInfo.phone || '—';
                const idno = intentInfo.idno || '—';
                const bank = intentInfo.bankNo || '—';
                const acct = intentInfo.bankAcct || '—';
                
                const laborType = emp.laborType || 'contract';
                const laborTypeHTML = `<span class="tag ${laborType === 'hire' ? 'tag-hire' : 'tag-contract'}">${laborType === 'hire' ? '雇傭 (有勞健保)' : '承攬 (無勞健保)'}</span>`;
            
const specialty = emp.specialty || '—';
                const status = intentInfo.status || '已核准';

                if (searchVal) {
                    const searchStr = `${name} ${phone} ${specialty} ${idno}`.toLowerCase();
                    if (!searchStr.includes(searchVal)) return;
                }

                const tr = document.createElement("tr");

                // 津貼明細字串
                const allowances = [];
                if (emp.transAllow > 0) allowances.push(`交:${emp.transAllow}`);
                if (emp.lodgAllow > 0) allowances.push(`宿:${emp.lodgAllow}`);
                if (emp.profAllow > 0) allowances.push(`專:${emp.profAllow}`);
                const allowStr = allowances.length > 0 ? allowances.join(" | ") : "無額外津貼";

                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td><span class="tag ${emp.isLead ? 'tag-lead' : 'tag-staff'}">${emp.isLead ? '👑 領隊' : '👤 同仁'}</span></td>
                    <td>${laborTypeHTML}</td>
                    <td>${specialty}</td>
                    <td>${phone}</td>
                    <td><code style="color:var(--text-muted)">${idno}</code></td>
                    <td>${bank}</td>
                    <td><code style="color:var(--text-muted)">${acct}</code></td>
                    <td><span style="font-size:0.8rem; color:#A7F3D0;">${allowStr}</span></td>
                    <td style="text-align: center;">
                        <div class="action-group" style="justify-content: center;">
                            <button class="btn-action" title="編輯人事資料" onclick="openEditModal('${name}')">✏️</button>
                            <button class="btn-action" title="刪除同仁" onclick="deleteEmployee('${name}')">❌</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (tbody.innerHTML === "") {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--text-muted); padding:2rem;">🔍 沒有找到符合條件的同仁！</td></tr>`;
            }
        }

        // 開啟新增彈窗
        function openAddModal() {
            document.getElementById("modal-title").textContent = "👥 新增同仁人事檔案";
            document.getElementById("edit-original-name").value = "";
            
            document.getElementById("emp-name").value = "";
            document.getElementById("emp-name").disabled = false;
            document.getElementById("emp-specialty").value = "拉線工程";
            document.getElementById("emp-phone").value = "";
            document.getElementById("emp-is-lead").value = "false";
            document.getElementById("emp-labor-type").value = "hire";
            document.getElementById("emp-idno").value = "";
            document.getElementById("emp-status").value = "已核准";
            document.getElementById("emp-bank-no").value = "";
            document.getElementById("emp-bank-acct").value = "";
            document.getElementById("emp-allow-trans").value = "0";
            document.getElementById("emp-allow-lodg").value = "0";
            document.getElementById("emp-allow-prof").value = "0";

            document.getElementById("employee-modal").classList.add("show");
        }

        // 開啟編輯彈窗
        function openEditModal(name) {
            document.getElementById("modal-title").textContent = `✏️ 編輯人事檔案：${name}`;
            document.getElementById("edit-original-name").value = name;
            
            HimoriDb.load();
            const emp = HimoriDb.employeeDb[name];
            
            const intentList = HimoriDb.intentDb || [];
            const intentInfo = intentList.find(i => i.name === name) || {};
            
            const cards = HimoriDb.cardsDb || {};
            const cardInfo = cards[name] || {};

            document.getElementById("emp-name").value = name;
            document.getElementById("emp-name").disabled = true; // 姓名做為 key，不給編輯
            document.getElementById("emp-specialty").value = emp.specialty || "拉線工程";
            document.getElementById("emp-phone").value = cardInfo.phone || intentInfo.phone || "";
            document.getElementById("emp-is-lead").value = emp.isLead ? "true" : "false";
            document.getElementById("emp-labor-type").value = emp.laborType || "contract";
            document.getElementById("emp-idno").value = intentInfo.idno || "";
            document.getElementById("emp-status").value = intentInfo.status || "已核准";
            document.getElementById("emp-bank-no").value = intentInfo.bankNo || "";
            document.getElementById("emp-bank-acct").value = intentInfo.bankAcct || "";
            document.getElementById("emp-allow-trans").value = emp.transAllow || 0;
            document.getElementById("emp-allow-lodg").value = emp.lodgAllow || 0;
            document.getElementById("emp-allow-prof").value = emp.profAllow || 0;

            document.getElementById("employee-modal").classList.add("show");
        }

        // 關閉彈窗
        function closeModal() {
            document.getElementById("employee-modal").classList.remove("show");
        }

        // 儲存資料 (寫入各對應資料庫)
        function saveEmployeeData() {
            const originalName = document.getElementById("edit-original-name").value;
            const name = document.getElementById("emp-name").value.trim();
            const specialty = document.getElementById("emp-specialty").value;
            const phone = document.getElementById("emp-phone").value.trim();
            const isLead = document.getElementById("emp-is-lead").value === "true";
            const idno = document.getElementById("emp-idno").value.trim();
            const status = document.getElementById("emp-status").value;
            const bankNo = document.getElementById("emp-bank-no").value.trim();
            const bankAcct = document.getElementById("emp-bank-acct").value.trim();
            const laborType = document.getElementById("emp-labor-type").value;
            const transAllow = parseInt(document.getElementById("emp-allow-trans").value) || 0;
            const lodgAllow = parseInt(document.getElementById("emp-allow-lodg").value) || 0;
            const profAllow = parseInt(document.getElementById("emp-allow-prof").value) || 0;

            if (!name) {
                alert("❌ 請輸入員工姓名！");
                return;
            }

            HimoriDb.load();

            // 1. 寫入 employeeDb
            HimoriDb.employeeDb[name] = {
                specialty: specialty,
                transAllow: transAllow,
                lodgAllow: lodgAllow,
                profAllow: profAllow,
                isLead: isLead,
                laborType: laborType
            };

            // 2. 寫入 intentDb (基本資料與匯款銀行)
            let intent = HimoriDb.intentDb.find(i => i.name === name);
            if (!intent) {
                intent = { name: name, step: 'completed', signDate: new Date().toISOString().split('T')[0] };
                HimoriDb.intentDb.push(intent);
            }
            intent.phone = phone;
            intent.idno = idno;
            intent.bankNo = bankNo;
            intent.bankAcct = bankAcct;
            intent.status = status;

            // 3. 寫入 cardsDb (電子名片基礎)
            if (!HimoriDb.cardsDb[name]) {
                // 讀取全域公司地址作為預設值
                const companyAddress = (HimoriDb.companyConfig && HimoriDb.companyConfig.address) || "台北市信義區";
                HimoriDb.cardsDb[name] = {
                    enabled: true,
                    title: name,
                    phone: phone,
                    address: companyAddress
                };
            } else {
                HimoriDb.cardsDb[name].phone = phone;
            }

            // 4. 同步更新/新增團保基礎狀態為基本投保
            if (!HimoriDb.insurancesDb[name]) {
                HimoriDb.insurancesDb[name] = {
                    status: "basic",
                    increasedAmount: 0,
                    history: [
                        { date: new Date().toISOString().split('T')[0], type: "基本保險加保 (系統自動建立)", status: "已完成" }
                    ]
                };
            }

            // 存入 LocalStorage
            HimoriDb.save();
            
            // 廣播資料庫更新
            window.parent.dispatchEvent(new CustomEvent('himori_db_updated'));

            closeModal();
            renderEmployeeTable();
        }

        // 刪除同仁
        function deleteEmployee(name) {
            if (confirm(`⚠️ 確定要刪除同仁『${name}』的人事檔案嗎？\n這將移除其出勤津貼設定與意向資料，可能會影響現有的派工與考勤報表！`)) {
                HimoriDb.load();
                
                // 移除基礎名冊
                delete HimoriDb.employeeDb[name];
                
                // 移除電子名片
                delete HimoriDb.cardsDb[name];
                
                // 移除團保
                delete HimoriDb.insurancesDb[name];
                
                // 移除增員意向
                HimoriDb.intentDb = HimoriDb.intentDb.filter(i => i.name !== name);

                HimoriDb.save();

                window.parent.dispatchEvent(new CustomEvent('himori_db_updated'));
                renderEmployeeTable();
            }
        }
    </script>
