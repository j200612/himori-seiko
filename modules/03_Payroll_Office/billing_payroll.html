<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發薪與請款對帳模組</title>
  <style>
    :root {
      --primary-bg: #1e293b;
      --secondary-bg: #334155;
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --success: #10b981;
      --warning: #f59e0b;
      --text-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --bg-gradient: linear-gradient(135deg, #f8fafc, #f1f5f9);
    }
    
    body {
      margin: 0;
      font-family: 'Outfit', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      line-height: 1.5;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 頂部標題 */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-bg);
      font-size: 1.8rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* 控制面板 */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary-bg);
      box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.1);
    }

    button.btn-load {
      background: var(--primary-bg);
      color: var(--text-light);
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-load:hover {
      background: var(--secondary-bg);
      transform: translateY(-1px);
    }

    /* 警告警示框 */
    .warning-alert {
      background: rgba(244, 63, 94, 0.08);
      border-left: 4px solid var(--accent);
      color: #9f1239;
      padding: 12px 18px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
    }

    /* 彙總面板 */
    .summary-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
      padding: 20px 24px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      border-top: 4px solid var(--primary-bg);
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .summary-value.highlight {
      color: var(--accent);
    }

    /* 表格設計 */
    .table-wrapper {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
      overflow-x: auto;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: var(--primary-bg);
      color: var(--text-light);
      padding: 14px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-dark);
      word-break: break-all;
      white-space: pre-wrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #f8fafc;
    }

    /* 特殊按鈕及徽章 */
    .btn-approve {
      background: var(--accent);
      color: var(--text-light);
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn-approve:hover {
      background: var(--accent-hover);
      transform: scale(1.03);
    }

    .status-frozen {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .status-approved {
      color: var(--success);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .status-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    /* 響應式優化 */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .controls {
        padding: 12px 16px;
        flex-direction: column;
        align-items: stretch;
      }
      .control-group {
        justify-content: space-between;
      }
      button.btn-load {
        width: 100%;
        text-align: center;
      }
      .summary-card {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-area">
      <h1>發薪與請款對帳模組</h1>
    </div>

    <!-- 控制面板 -->
    <div class="controls">
      <div class="control-group">
        <label for="yearSelect">年份</label>
        <select id="yearSelect"></select>
      </div>
      <div class="control-group">
        <label for="monthSelect">月份</label>
        <select id="monthSelect"></select>
      </div>
      <button class="btn-load" id="loadBtn">查詢帳目</button>
    </div>

    <!-- 警示區域 -->
    <div id="alertsContainer"></div>

    <!-- 彙總面板 -->
    <div class="summary-card" id="summaryCard">
      <div class="summary-item">
        <span class="summary-label">上游請款 (晶廷)</span>
        <span class="summary-value" id="valExternal">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">同仁發放報酬</span>
        <span class="summary-value" id="valInternal">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">公司預估淨利</span>
        <span class="summary-value highlight" id="valNetProfit">0</span>
      </div>
    </div>

    <!-- 帳目大表 -->
    <div class="table-wrapper">
      <table id="payrollTable">
        <thead>
          <tr id="tableHeaderRow">
            <th>同仁姓名</th>
            <th>外部請款 (元)</th>
            <th>內部報酬 (元)</th>
            <th>特准津貼/扣減 (元)</th>
            <th>累計出工天數</th>
            <th>預估淨毛利 (元)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const loadBtn = document.getElementById('loadBtn');
    const alertsContainer = document.getElementById('alertsContainer');
    const tableBody = document.getElementById('tableBody');
    
    const valExternal = document.getElementById('valExternal');
    const valInternal = document.getElementById('valInternal');
    const valNetProfit = document.getElementById('valNetProfit');

    // 初始化年份
    const curYear = new Date().getFullYear();
    for (let y = 2026; y <= curYear + 1; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = `${y} 年`;
      yearSelect.appendChild(opt);
    }
    yearSelect.value = 2026; // 固定鎖定 2026 年為預設

    // 初始化月份 (支援全年總帳)
    const months = [
      { val: 'all', text: '年度總帳 (全年)' },
      { val: 1, text: '1 月' }, { val: 2, text: '2 月' }, { val: 3, text: '3 月' },
      { val: 4, text: '4 月' }, { val: 5, text: '5 月' }, { val: 6, text: '6 月' },
      { val: 7, text: '7 月' }, { val: 8, text: '8 月' }, { val: 9, text: '9 月' },
      { val: 10, text: '10 月' }, { val: 11, text: '11 月' }, { val: 12, text: '12 月' }
    ];
    months.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.val;
      opt.textContent = m.text;
      monthSelect.appendChild(opt);
    });
    monthSelect.value = 6; // 固定鎖定 6 月為預設以配合破月測試

    loadBtn.addEventListener('click', fetchData);
    
    function formatNumber(num) {
      return Number(num).toLocaleString('zh-TW');
    }

    async function fetchData() {
      const year = yearSelect.value;
      const month = monthSelect.value;
      try {
        const res = await fetch(`/api/admin/billing-payroll?year=${year}&month=${month}`);
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error("Fetch payroll error", e);
        alert("⚠️ 無法載入帳目數據，請檢查後台伺服器。");
      }
    }

    function render(data) {
      // 1. 渲染彙總數據
      valExternal.textContent = `NT$ ${formatNumber(data.totalExternal)}`;
      valInternal.textContent = `NT$ ${formatNumber(data.totalInternal)}`;
      valNetProfit.textContent = `NT$ ${formatNumber(data.netProfit)}`;

      // 2. 渲染警示訊息
      alertsContainer.innerHTML = '';
      let hasAlerts = false;
      data.details.forEach(d => {
        if (d.alerts && d.alerts.length > 0) {
          hasAlerts = true;
          d.alerts.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'warning-alert';
            div.innerHTML = `<span>⚠️ ${msg}</span>`;
            alertsContainer.appendChild(div);
          });
        }
      });

      // 3. 渲染明細表格
      tableBody.innerHTML = '';
      const isYearly = monthSelect.value === 'all';
      
      data.details.forEach(d => {
        const tr = document.createElement('tr');
        
        // 特准津貼欄位渲染邏輯 (對齊黃金防線)
        let specialCellHtml = '';
        if (d.name === '萬昱賢') {
          if (isYearly) {
            specialCellHtml = `<span>${formatNumber(d.special)}</span><span class="status-hint">(累計津貼)</span>`;
          } else {
            // 月度查詢
            const isJune = parseInt(monthSelect.value) === 6;
            if (isJune) {
              specialCellHtml = `<span class="status-approved">${formatNumber(d.special)}</span><span class="status-hint">(破月特准: 勞健保500+房租1000)</span>`;
            } else if (parseInt(monthSelect.value) >= 7) {
              if (d.special > 0) {
                specialCellHtml = `<span class="status-approved">${formatNumber(d.special)}</span><span class="status-hint">(已解鎖: 勞健保2000+房租3000)</span>`;
              } else {
                specialCellHtml = `
                  <span class="status-frozen">⚠️ 0</span>
                  <span class="status-hint">(出工不滿20天，已自動凍結)</span>
                  <button class="btn-approve" onclick="approveSpecial('${d.name}', ${yearSelect.value}, ${monthSelect.value})">總裁特准發放</button>
                `;
              }
            } else {
              specialCellHtml = `<span>${formatNumber(d.special)}</span>`;
            }
          }
        } else {
          // 其他同仁無特別津貼/扣減，永久為 0
          specialCellHtml = `<span>0</span><span class="status-hint">(介紹費/佣金歸零)</span>`;
        }

        tr.innerHTML = `
          <td style="font-weight: 600;">${d.name}</td>
          <td style="font-weight: 500;">NT$ ${formatNumber(d.external)}</td>
          <td style="font-weight: 500;">NT$ ${formatNumber(d.internal)}</td>
          <td>${specialCellHtml}</td>
          <td style="text-align: center; font-weight: 600;">${d.workDays} 天</td>
          <td style="font-weight: 600; color: ${d.net >= 0 ? 'var(--text-dark)' : 'var(--accent)'};">
            NT$ ${formatNumber(d.net)}
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    async function approveSpecial(name, year, month) {
      if (confirm(`確定要手動特准發放 ${name} ${year}年${month}月的 5,000 元特准津貼嗎？此項特准將立即記錄於審計日誌。`)) {
        try {
          const response = await fetch('/api/admin/internal-agent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: `請幫我手動特准${name} ${year}年${month}月的特准津貼，備註：總裁手動核准發放`,
              empId: 'admin',
              role: '最高系統管理員 / 總裁',
              name: '羅玉軒'
            })
          });
          const resData = await response.json();
          alert(`✅ 特准成功！安全審計日誌已寫入雲端。\n${resData.reply}`);
          fetchData();
        } catch (e) {
          alert('⚠️ 系統連線失敗，請稍後再試。');
        }
      }
    }

    // 頁面加載自動查詢一次
    fetchData();
  </script>
</body>
</html>
