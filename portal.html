<head>

    <style>
        :root {
            --primary: #0F172A; /* 深藍 */
            --primary-light: #1E293B;
            --accent: #38BDF8; /* 科技藍 */
            --accent-glow: rgba(56, 189, 248, 0.4);
            --bg-dark: #020617;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --glass: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
        }

        body {
            background: url('01_企業識別與設計/底色.png') center center / cover no-repeat fixed;
            color: var(--text-light);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ════════════════════ 登入畫面 ════════════════════ */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            width: 150px;
            height: auto;
            margin-bottom: 1.8rem;
            transition: transform 0.3s;
        }

        .login-logo:hover {
            transform: scale(1.05);
        }

        .login-card h2 {
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #0F172A;
            letter-spacing: 1px;
        }

        .login-card p {
            color: #475569;
            font-size: 0.88rem;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem;
            background: #F8FAFC;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            color: #0F172A;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #0284C7;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.2);
            background: #ffffff;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .test-hint {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: #475569;
            text-align: left;
            background: #F8FAFC;
            border: 1px dashed #CBD5E1;
            border-radius: 6px;
            padding: 0.75rem;
            line-height: 1.5;
        }

        /* ════════════════════ 主介面排版 ════════════════════ */
        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 側邊欄 */
                sidebar {
            width: 260px;
            height: 100vh;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.75);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 100;
            overflow-y: auto !important;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        sidebar.collapsed {
            width: 80px;
            padding: 1.5rem 0.5rem;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        sidebar.collapsed .brand-header {
            justify-content: center;
            padding-bottom: 1.2rem;
        }

        .brand-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            max-width: 180px;
            flex-grow: 1;
        }

        sidebar.collapsed .brand-logo-wrapper {
            justify-content: center;
            max-width: 50px;
        }

        .brand-header img {
            height: 32px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        sidebar.collapsed .brand-header img {
            max-width: 44px;
            max-height: 32px;
        }

        .brand-title {
            transition: opacity 0.2s ease, max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            max-width: 200px;
            overflow: hidden;
        }

        sidebar.collapsed .brand-title {
            opacity: 0;
            max-width: 0;
            display: none;
        }

        .brand-title h1 {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .brand-title p {
            font-size: 0.58rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .btn-toggle-sidebar {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: all 0.2s;
            outline: none;
            flex-shrink: 0;
        }

        .btn-toggle-sidebar:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        sidebar.collapsed .btn-toggle-sidebar {
            display: none;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        /* 優化滾動條樣式，避免擠壓抖動 */
        .nav-menu::-webkit-scrollbar {
            width: 4px;
        }
        .nav-menu::-webkit-scrollbar-track {
            background: transparent;
        }
        .nav-menu::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .nav-menu::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 1rem;
            margin-bottom: 0.4rem;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            border-left: 3px solid transparent;
            overflow: hidden;
            white-space: nowrap;
        }

        sidebar.collapsed .nav-item {
            justify-content: center;
            padding: 0.85rem 0;
            gap: 0;
        }

        .nav-icon {
            font-size: 1.1rem;
            min-width: 24px;
            text-align: center;
            transition: transform 0.2s;
        }

        sidebar.collapsed .nav-icon {
            min-width: unset;
        }

        .nav-text {
            transition: opacity 0.2s, max-width 0.3s;
            opacity: 1;
            max-width: 200px;
            word-break: break-all;
        }

        sidebar.collapsed .nav-text {
            opacity: 0;
            max-width: 0;
            display: none;
        }

        .nav-item:hover {
            color: white;
            background: rgba(56, 189, 248, 0.08);
            border-left-color: rgba(56, 189, 248, 0.4);
        }

        .nav-item.active {
            color: white;
            background: rgba(56, 189, 248, 0.15);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        /* 使用者區塊 */
        .user-block {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem 0;
            border-top: 1px solid var(--border);
            margin-top: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        sidebar.collapsed .user-block {
            padding: 0.4rem 0;
            justify-content: center;
            align-items: center;
        }

        .user-avatar {
            display: none !important;
        }

        .user-info {
            display: none !important;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            width: 100%;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            flex-shrink: 0;
            padding: 0 0.8rem;
        }

        .logout-text {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 1;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        sidebar.collapsed .btn-logout {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            padding: 0;
            margin: 0 auto;
            background: none;
            border: none;
        }

        sidebar.collapsed .logout-text {
            display: none;
        }

        .btn-logout:hover {
            color: var(--danger);
            transform: scale(1.03);
            background-color: rgba(239, 68, 68, 0.15);
            filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.2));
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* 側邊欄版權宣告 */
        .sidebar-copyright {
            font-size: 0.58rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.5rem;
            border-top: 1px solid var(--border);
            padding-top: 0.5rem;
            white-space: normal;
            word-break: break-all;
            width: 100%;
            transition: all 0.3s;
            line-height: 1.3;
        }

        sidebar.collapsed .sidebar-copyright {
            display: none;
        }

        /* 主工作區域 */
        main {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- 🌐 數據中心引入 -->
    <script src="global_shared.js?v=20260721_v6_BRAIN_LINE_LIVE"></script>

    <!-- 🔐 登入畫面 -->
    <div id="login-overlay">
        <div class="login-card">
            <img id="login-logo" class="login-logo" src="01_企業識別與設計/橫式logo.png" alt="日森精工">
            <h2>AI行政中心</h2>

            <div class="form-group">
                <label>登入密碼</label>

            </div>

            <button class="btn-login" onclick="attemptLogin()">🔐 安全認證登入</button>
            
            <a href="index.html" style="color: #0284C7; font-size: 0.85rem; text-decoration: none; display: inline-block; margin-top: 1.2rem; font-weight: 600; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">⬅️ 返回日森精工官網首頁</a>
            
            <div class="test-hint">
                <strong>💡 測試帳密指引：</strong><br>
                • 主管：admin / admin123 (全權限)<br>
                • 會計：accountant / acc123 (財務/計薪)<br>
                • 同仁/領隊：emp101 / emp123 (員工自助)
            </div>
            <div style="font-size: 0.72rem; color: #94A3B8; text-align: center; margin-top: 1.5rem; letter-spacing: 0.5px;">
                © 2026 映向行銷. Powered by Image Marketing
            </div>
        </div>
    </div>

    <!-- 🏢 主系統控制台 -->
    <div id="app-container" style="display:none;">
        <!-- 側邊欄 -->
        <sidebar>
            <div class="brand-header">
                <div class="brand-logo-wrapper" onclick="toggleSidebarCollapse()" title="點擊展開/收起側邊欄">
                    <img id="sidebar-logo" src="01_企業識別與設計/直式logo.png" alt="Logo">
                    <div class="brand-title">
                        <h1 id="sidebar-title">日森精工</h1>
                        <p id="sidebar-subtitle">Digital Control Center</p>
                    </div>
                </div>
                <button class="btn-toggle-sidebar" onclick="toggleSidebarCollapse()" title="收起側邊欄" aria-label="收起側邊欄">
                    <svg class="toggle-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                        <path d="M14 9l-3 3 3 3"/>
                    </svg>
                </button>
            </div>

            <!-- 動態側邊導航列 -->
            <div class="nav-menu" id="sidebar-nav">
                <!-- 由 JS 根據員工授權模組動態渲染 -->
            </div>

            <!-- 使用者狀態與登出 -->
            <div class="user-block">
                <div class="user-avatar" id="avatar-char" style="display:none;">林</div>
                <div class="user-info" style="display:none;">
                    <div class="user-name" id="display-name">林總經理</div>
                    <div class="user-role" id="display-role">系統管理員 / 主管</div>
                </div>
                <button class="btn-logout" title="登出系統" onclick="logout()" aria-label="登出系統">
                    <svg class="logout-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span class="logout-text">安全登出</span>
                </button>
            </div>
            <div class="sidebar-copyright">
                💡 系統開發維護：映向行銷有限公司 © 2026
            </div>
        </sidebar>

        <!-- 主工作面板 -->
        <main>
            <!-- 嵌入子系統 iframe -->
            <iframe id="main-frame" src="about:blank"></iframe>
        </main>
    </div>

    <!-- ⚙️ 核心路由與控制 JS -->
    <script>
        let currentUser = null;
        let isSidebarCollapsed = false;

        // 縮放側邊欄
        function toggleSidebarCollapse() {
            const sidebar = document.querySelector("sidebar");
            isSidebarCollapsed = !isSidebarCollapsed;
            
            if (isSidebarCollapsed) {
                sidebar.classList.add("collapsed");
                localStorage.setItem("himori_sidebar_collapsed", "true");
            } else {
                sidebar.classList.remove("collapsed");
                localStorage.setItem("himori_sidebar_collapsed", "false");
            }
            
            updateSidebarLogo();
            updateBrandTooltip();
        }

        // 更新 Logo Wrapper 的 Tooltip 提示
        function updateBrandTooltip() {
            const logoWrapper = document.querySelector(".brand-logo-wrapper");
            if (logoWrapper) {
                if (isSidebarCollapsed) {
                    logoWrapper.title = "點擊展開側邊欄";
                } else {
                    logoWrapper.title = "點擊收起側邊欄";
                }
            }
        }

        // 更新側邊欄 Logo 圖片 (一律顯示直式 Logo 以免展開時文字被遮擋)
        function updateSidebarLogo() {
            const sidebarLogo = document.getElementById("sidebar-logo");
            if (sidebarLogo && typeof HimoriCompanyConfig !== 'undefined') {
                sidebarLogo.src = HimoriCompanyConfig.logoVertical || HimoriCompanyConfig.logoHorizontal;
            }
        }

        // 載入全域品牌設定
        function applyPortalBranding() {
            if (typeof HimoriCompanyConfig !== 'undefined') {
                // 修改網頁 Title
                document.title = `${HimoriCompanyConfig.name} | AI行政中心`;

                // 登入頁面
                const loginLogo = document.getElementById("login-logo");
                if (loginLogo) loginLogo.src = HimoriCompanyConfig.logoHorizontal;
                const loginTitle = document.querySelector(".login-card h2");
                if (loginTitle) loginTitle.textContent = `${HimoriCompanyConfig.name} AI行政中心`;

                // 側邊欄 Logo
                updateSidebarLogo();
                
                const sidebarTitle = document.getElementById("sidebar-title");
                if (sidebarTitle) sidebarTitle.textContent = HimoriCompanyConfig.name;
                const sidebarSubtitle = document.getElementById("sidebar-subtitle");
                if (sidebarSubtitle) sidebarSubtitle.textContent = HimoriCompanyConfig.engName;

                // 變更 body 背景圖
                if (HimoriCompanyConfig.backgroundImg) {
                    document.body.style.backgroundImage = `url('${HimoriCompanyConfig.backgroundImg}')`;
                }
            }
        }

        // 認證登入
        function attemptLogin() {
            const empIdInput = document.getElementById("login-empid").value.trim();
            const passInput = document.getElementById("login-password").value.trim();

            if (!empIdInput || !passInput) {
                alert("❌ 請輸入員工編號與密碼！");
                return;
            }

            // 在 accountsDb 中尋找匹配的帳號
            const accounts = HimoriDb.accountsDb || [];
            const user = accounts.find(acc => acc.empId === empIdInput && acc.password === passInput);

            if (user) {
                currentUser = {
                    empId: user.empId,
                    name: user.name,
                    role: user.role,
                    avatar: user.name.charAt(0),
                    authorizedModules: user.authorizedModules || []
                };
                
                // 存入 sessionStorage
                sessionStorage.setItem("himori_user", JSON.stringify(currentUser));
                
                launchApp();
            } else {
                alert("❌ 員工編號或密碼錯誤！");
            }
        }

        // 啟動系統控制台
        function launchApp() {
            // 隱藏登入，顯示控制面板
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("app-container").style.display = "flex";

            // 渲染資訊
            document.getElementById("display-name").textContent = currentUser.name;
            document.getElementById("display-role").textContent = currentUser.role;
            document.getElementById("avatar-char").textContent = currentUser.avatar;
            document.getElementById("avatar-char").title = `${currentUser.name} (${currentUser.role})`;

            renderSidebarMenu();

            // 預設切換至該身份的第一個可用選單
            if (currentUser.authorizedModules && currentUser.authorizedModules.length > 0) {
                // 尋找第一個可用且訂閱的模組
                HimoriDb.load();
                const subscribed = HimoriDb.subscribedModules || [];
                const fallbackModId = currentUser.authorizedModules.find(mId => {
                    const m = HimoriModules[mId];
                    return m && (m.category === 'base' || subscribed.includes(mId));
                });
                if (fallbackModId) {
                    switchSubModule(fallbackModId);
                } else {
                    document.getElementById("main-frame").src = "about:blank";
                }
            } else {
                document.getElementById("main-frame").src = "about:blank";
                alert("💡 您目前沒有任何授權的工作項目，請洽主管為您配置權限。");
            }
            if (typeof checkAISecretaryPermission === 'function') checkAISecretaryPermission();
        }

        // 渲染導航列 (拆分 Emoji 與文字以支援側邊欄縮放)
        function renderSidebarMenu() {
            const menuContainer = document.getElementById("sidebar-nav");
            menuContainer.innerHTML = "";

            HimoriDb.load();
            const subscribed = HimoriDb.subscribedModules || [];

            // 檢查是否為外包承攬夥伴以實施最高授權分流
            const partnerNames = ['邱冠英', '郭怡蘭', '萬昱賢'];
            const isPartner = partnerNames.includes(currentUser.name) || (currentUser.role && (currentUser.role.includes('同仁') || currentUser.role.includes('領隊')));

            if (!isPartner) {
                const aiItem = document.createElement("div");
                aiItem.className = "nav-item";
                aiItem.id = "nav-func_ai_asset_ingestion";
                aiItem.title = "🧠 AI大腦模組";
                aiItem.innerHTML = `<span class="nav-icon">🧠</span><span class="nav-text">AI大腦模組</span>`;
                aiItem.onclick = () => switchSubModule("func_ai_asset_ingestion");
                menuContainer.appendChild(aiItem);
            }

            const modules = currentUser.authorizedModules || [];
            modules.forEach(modId => {
                if (modId === 'func_ai_asset_ingestion') return; // 已在最頂層硬編碼釘上
                const mod = HimoriModules[modId];
                // 只有訂閱的模組，或是基礎(Base)模組，才會在側邊選單中渲染
                if (mod && (mod.category === 'base' || subscribed.includes(modId))) {
                    const item = document.createElement("div");
                    item.className = "nav-item";
                    item.id = `nav-${modId}`;
                    item.title = mod.name; // 懸停顯示完整名稱 ( collapsed 時極有用 )
                    
                    const parts = mod.name.split(" ");
                    const emoji = parts[0] || "";
                    const text = parts.slice(1).join(" ") || "";
                    
                    item.innerHTML = `<span class="nav-icon">${emoji}</span><span class="nav-text">${text}</span>`;
                    item.onclick = () => switchSubModule(modId);
                    menuContainer.appendChild(item);
                }
            });
        }

        // 模組載入
        function switchSubModule(moduleId) {
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            const activeNav = document.getElementById(`nav-${moduleId}`);
            if (activeNav) activeNav.classList.add("active");

            const mod = HimoriModules[moduleId];
            const frame = document.getElementById("main-frame");

            const srcUrl = mod ? mod.src : (moduleId === 'func_ai_asset_ingestion' ? 'modules/01_Core_Base/ai_asset_ingestion/ai_asset_ingestion.html' : '');
            if (srcUrl) {
                frame.src = srcUrl + (srcUrl.includes('?') ? '&' : '?') + 'v=20260712_v2_IMAGE_MARKETING';
            } else {
                frame.src = "about:blank";
            }
        }

        // 登出
        function logout() {
            if (confirm("是否確定退出AI行政中心？")) {
                currentUser = null;
                sessionStorage.removeItem("himori_user");
                document.getElementById("app-container").style.display = "none";
                document.getElementById("login-overlay").style.display = "flex";
                document.getElementById("main-frame").src = "about:blank";
                document.getElementById("login-password").value = "";
                const widget = document.getElementById("ai-secretary-widget");
                if (widget) widget.style.display = "none";
                const box = document.getElementById("ai-secretary-box");
                if (box) box.classList.remove("active");
            }
        }

        // 監聽來自子模組的自訂事件
        window.addEventListener("himori_db_updated", function() {
            console.log("Portal: 偵測到資料庫變更");
            
            // 重新載入品牌與選單
            applyPortalBranding();
            
            // 重新加載 accountsDb 看看當前登入使用者的權限是否在權限頁面被主管更改了
            if (currentUser) {
                // 重新載入 accounts 數據庫
                HimoriDb.load();
                const accounts = HimoriDb.accountsDb || [];
                const updatedUser = accounts.find(acc => acc.empId === currentUser.empId);
                if (updatedUser) {
                    currentUser.name = updatedUser.name;
                    currentUser.role = updatedUser.role;
                    currentUser.avatar = updatedUser.name.charAt(0);
                    currentUser.authorizedModules = updatedUser.authorizedModules || [];
                    
                    // 重新渲染 sidebar 的資訊
                    document.getElementById("display-name").textContent = currentUser.name;
                    document.getElementById("display-role").textContent = currentUser.role;
                    document.getElementById("avatar-char").textContent = currentUser.avatar;
                    document.getElementById("avatar-char").title = `${currentUser.name} (${currentUser.role})`;

                    // 重新渲染選單
                    renderSidebarMenu();
                    
                    if (typeof checkAISecretaryPermission === 'function') checkAISecretaryPermission();
                    
                    // 檢查目前顯示的模組是否還被授權且訂閱，若不滿足，切換到第一個可用模組，或空白
                    const activeNav = document.querySelector(".nav-item.active");
                    if (activeNav) {
                        const activeId = activeNav.id.replace("nav-", "");
                        const mod = HimoriModules[activeId];
                        const subscribed = HimoriDb.subscribedModules || [];
                        const isSubscribed = mod && (mod.category === 'base' || subscribed.includes(activeId));
                        
                        if (!currentUser.authorizedModules.includes(activeId) || !isSubscribed) {
                            const fallbackModId = currentUser.authorizedModules.find(mId => {
                                const m = HimoriModules[mId];
                                return m && (m.category === 'base' || subscribed.includes(mId));
                            });
                            if (fallbackModId) {
                                switchSubModule(fallbackModId);
                            } else {
                                document.getElementById("main-frame").src = "about:blank";
                            }
                        }
                    }
                }
            }
        });

        // 載入時嘗試自動登入與還原側邊欄狀態
        window.addEventListener("DOMContentLoaded", function() {
            const collapsedSaved = localStorage.getItem("himori_sidebar_collapsed");
            if (collapsedSaved === "true") {
                isSidebarCollapsed = true;
                const sidebar = document.querySelector("sidebar");
                if (sidebar) sidebar.classList.add("collapsed");
            }

            applyPortalBranding();
            updateBrandTooltip();
            const savedUser = sessionStorage.getItem("himori_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                launchApp();
            }
        });
    </script>

    <script>
        const secChatBody = document.getElementById("ai-sec-chat-body");
        const secChatInput = document.getElementById("ai-sec-chat-input");

        function checkAISecretaryPermission() {
            const widget = document.getElementById("ai-secretary-widget");
            if (!widget) return;
            if (currentUser && (currentUser.empId === 'admin' || currentUser.empId === '0937581112' || (currentUser.role && (currentUser.role.includes('總裁') || currentUser.role.includes('管理員'))))) {
                widget.style.display = "block";
            } else {
                widget.style.display = "none";
                const box = document.getElementById("ai-secretary-box");
                if (box) box.classList.remove("active");
            }
        }

        function toggleAISecretary() {
            const box = document.getElementById("ai-secretary-box");
            box.classList.toggle("active");
            if (box.classList.contains("active")) {
                secChatInput.focus();
                if (secChatBody.children.length === 0) {
                    appendSecMessage("ai", "您好，總裁！我是您的 AI 秘書特助。我可以協助您進行各類工時、津貼、雙軌薪資請款的對話式查詢，或是幫您補登、修改工時紀錄。請問今天需要我做什麼？");
                }
            }
        }

        function appendSecMessage(sender, text) {
            const msg = document.createElement("div");
            msg.className = `ai-msg ${sender}`;
            msg.textContent = text;
            secChatBody.appendChild(msg);
            secChatBody.scrollTop = secChatBody.scrollHeight;
        }

        function showSecTyping() {
            const typing = document.createElement("div");
            typing.id = "ai-sec-typing";
            typing.className = "ai-typing";
            typing.innerHTML = '<span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span>';
            secChatBody.appendChild(typing);
            secChatBody.scrollTop = secChatBody.scrollHeight;
        }

        function removeSecTyping() {
            const typing = document.getElementById("ai-sec-typing");
            if (typing) typing.remove();
        }

        async function sendSecMessage() {
            const text = secChatInput.value.trim();
            if (!text) return;
            
            appendSecMessage("user", text);
            secChatInput.value = "";
            
            showSecTyping();
            
            try {
                const res = await fetch("/api/admin/internal-agent", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        empId: currentUser.empId,
                        role: currentUser.role,
                        name: currentUser.name
                    })
                });
                
                removeSecTyping();
                
                if (res.status === 403) {
                    appendSecMessage("system", "⚠️ 權限錯誤：此功能僅限總裁或最高管理權限存取。");
                    return;
                }
                
                const data = await res.json();
                if (data.error) {
                    appendSecMessage("ai", `❌ 系統錯誤: ${data.error}`);
                } else {
                    appendSecMessage("ai", data.reply);
                    if (data.actionExecuted) {
                        appendSecMessage("system", `⚙️ [AI 變更資料] 已成功寫入系統資料庫並記錄審計軌跡。`);
                        
                        // 觸發自訂事件以更新畫面與資料庫同步
                        const event = new CustomEvent("himori_db_updated");
                        window.dispatchEvent(event);
                        
                        // 如果有內嵌 iframe，通知 iframe 重新載入資料
                        const mainFrame = document.getElementById("main-frame");
                        if (mainFrame && mainFrame.contentWindow) {
                            try {
                                mainFrame.contentWindow.dispatchEvent(new CustomEvent("himori_db_updated"));
                                // 如果是 billing_payroll 頁面，嘗試重新呼叫 fetchData
                                if (typeof mainFrame.contentWindow.fetchData === 'function') {
                                    mainFrame.contentWindow.fetchData();
                                }
                            } catch (e) {
                                console.warn("Could not dispatch event to iframe", e);
                            }
                        }
                    }
                }
            } catch (e) {
                removeSecTyping();
                appendSecMessage("ai", `⚠️ 連線錯誤，請稍後再試。`);
            }
        }

        secChatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                sendSecMessage();
            }
        });

        // 頁面初始化後檢查一次
        setTimeout(() => {
            checkAISecretaryPermission();
        }, 100);
    </script>
